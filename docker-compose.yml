version: '3.8'

services:
  # ============================================
  # Backend Service (Python FastAPI)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hushh-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      # Python environment
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - ENVIRONMENT=production
      
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
      # Mount data directory for persistence
      - ./data:/app/data
      # Mount uploads directory
      - ./uploads:/app/uploads
    networks:
      - hushh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # Frontend Service (React + Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hushh-frontend
    ports:
      - "80:80"
      - "443:443"  # If you add SSL
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hushh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# ============================================
# Networks
# ============================================
networks:
  hushh-network:
    driver: bridge

# ============================================
# Volumes (optional - for persistent data)
# ============================================
volumes:
  backend-logs:
  backend-data:
